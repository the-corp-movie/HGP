<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>HGP - Login / Sign Up</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f6f8; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
    .card { background: #fff; padding: 24px; border-radius: 6px; border: 1px solid #ddd; width: 320px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
    h2 { margin-top: 0; color: #0077c5; }
    input { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
    button { width: 100%; padding: 10px; background: #0077c5; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; margin-top: 8px; }
    button:hover { background: #005fa3; }
    .toggle { text-align: center; margin-top: 12px; font-size: 13px; color: #666; cursor: pointer; }
    .msg { font-size: 13px; color: red; margin-top: 8px; text-align: center; }
  </style>
</head>
<body>

  <div class="card">
    <h2 id="form-title">Login to HGP</h2>
    
    <input type="text" id="username" placeholder="Enter Username">
    <input type="password" id="password" placeholder="Enter Password">
    
    <button id="auth-btn" onclick="handleAuth()">Login</button>
    <div id="error-msg" class="msg"></div>

    <div class="toggle" onclick="toggleMode()">
      <span id="toggle-text">Need an account? Sign Up</span>
    </div>
  </div>

  <script>
    let isSignUp = false;

    function toggleMode() {
      isSignUp = !isSignUp;
      document.getElementById('form-title').innerText = isSignUp ? 'Create HGP Account' : 'Login to HGP';
      document.getElementById('auth-btn').innerText = isSignUp ? 'Sign Up' : 'Login';
      document.getElementById('toggle-text').innerText = isSignUp ? 'Already have an account? Login' : 'Need an account? Sign Up';
      document.getElementById('error-msg').innerText = '';
    }

    function handleAuth() {
      const user = document.getElementById('username').value.trim();
      const pass = document.getElementById('password').value.trim();
      const msg = document.getElementById('error-msg');

      if (!user || !pass) {
        msg.innerText = "Please fill in all fields.";
        return;
      }

      const storedUser = localStorage.getItem('hgp_user_' + user);

      if (isSignUp) {
        if (storedUser) {
          msg.innerText = "Username already exists!";
        } else {
          localStorage.setItem('hgp_user_' + user, JSON.stringify({ username: user, password: pass }));
          localStorage.setItem('hgp_session', user);
          window.location.href = 'index.html';
        }
      } else {
        if (!storedUser) {
          msg.innerText = "User not found. Please Sign Up.";
          return;
        }
        const parsed = JSON.parse(storedUser);
        if (parsed.password === pass) {
          localStorage.setItem('hgp_session', user);
          window.location.href = 'index.html';
        } else {
          msg.innerText = "Incorrect password.";
        }
      }
    }
  </script>
</body>
</html>
